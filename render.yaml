# Render Blueprint — free tier (SQLite, no managed DB)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: breathe-esg-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn breathe_esg.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: USE_SQLITE
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: COOKIE_DOMAIN
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: TRAVEL_FIXTURE_PATH
        value: /opt/render/project/src/backend/fixtures/mock_travel_response.json

  - type: web
    name: breathe-esg-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
